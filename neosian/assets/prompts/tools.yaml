# Model-facing descriptions of the built-in tools (ECOSYSTEM §8).

todo: "Update the task list with current progress. Pass the complete list of tasks - this replaces all existing tasks. Use status: 'pending' for not started, 'in_progress' for current work (keep to one at a time), 'completed' when done."

skill_list: "List available skills with their names and descriptions. Use this to discover what skills are available before loading one."

skill_load: "Load a skill by name. Returns the full instructions. Use list_skills first to see what's available."

recall_turn_any: "Re-read one turn of a recorded conversation verbatim. Every agent's sessions are listed in the memory index under sessions/ (each document names its conversation id), and the 'where we left off' block at session start shows each turn as one line labeled with its number in square brackets, e.g. [7]. Pass the conversation id and a turn number to get that turn's full original text, including complete tool calls and results. Use it whenever a log line mentions something you need the details of."

recall_turn: "Re-read one earlier turn verbatim. Compacted turns appear in the conversation log — and in any view of another conversation — as one-line entries labeled with turn numbers in square brackets, e.g. [7] or [3-6]. Pass a turn number to get that turn's full original text, including complete tool calls and results; pass conversation=<id> to read a turn of a viewed conversation (omit it for this one). Use it whenever a log entry mentions something you need the details of."
