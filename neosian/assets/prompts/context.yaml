# The shared-context prompt pack (DESIGN §7, §21 — NB). `board` is the
# description the `Conversation(board=…)` sugar gives its mount; the
# `view_*` keys frame the synthetic USER message that carries a
# ConversationView — another conversation, log-projected and read-only.
# {{conversation_id}}, {{first}}, {{last}} and {{count}} are interpolated
# by prompt_assets.render.

board: >-
  The board: the shared working set for this task — what we are doing
  now, who is on what, open questions, decisions taken. Other agents on
  the task read and write it too; keep it current and small.

view_header: >-
  [view of conversation {{conversation_id}} — another agent's history,
  read-only, log-projected; the numbers in square brackets are its turn
  references]

view_footer: >-
  [end of view — call recall_turn(n, conversation="{{conversation_id}}")
  to re-read its turn n verbatim, or search_history(query,
  conversation="{{conversation_id}}") to find one by its words; [link
  {{conversation_id}}:N] stands for a URL, path or id of its turns: use it
  as written in any tool call, or recall the turn to read it]

view_fold: >-
  [{{first}}-{{last}}] {{count}} earlier turns not shown

view_empty: >-
  (no turns yet)

# The `start_*` keys frame what `neosian record` prints on a foreign
# agent's SessionStart hook (§21.7): the memory index, then "where we
# left off" — the scope's recent sessions, log-projected and read-only.
# {{conversation_id}} and {{actor}} are interpolated per session.

start_index: >-
  [neosian memory — the index of this scope; read a document with the
  memory tool's view command, never guess its contents]

start_header: >-
  [where we left off — the sessions recorded in this scope, newest first,
  log-projected and read-only; the numbers in square brackets are turn
  references]

start_session: >-
  [conversation {{conversation_id}} — written by {{actor}}]

start_footer: >-
  [end — call recall_turn(n, conversation="<id>") on the neosian-memory
  server to re-read a listed turn verbatim, or search_history(query) there
  to find a turn of any session by its words; [link <id>:N] stands for a
  URL, path or id of that conversation — recall the turn to read it]

start_empty: >-
  (no sessions recorded in this scope yet)

# The handoff (§33, N6). `start_note` frames a pending note shown in
# full at session start, `start_note_line` the one line a stale one
# gets; the `continue_*` keys frame what continue_session delivers;
# `handoff_recorded` is the ack a handoff call answers (the record reads
# it back) and `handoff_guide` the reminder on a refused note.

start_note: >-
  [handoff note — written {{written}} by {{actor}}; a session that says
  "continue" picks it up: call continue_session({{argument}}) to receive
  that conversation whole; a session that does not is new work and
  leaves it standing]

start_note_end: >-
  [end of note]

start_note_line: >-
  [a handoff note from {{actor}} ({{written}}) is still pending:
  continue_session({{argument}}) picks it up; view /{{mount}}/handoff
  reads it]

continue_header: >-
  [continuing conversation {{conversation_id}} — written by {{actor}},
  {{turns}} turns, {{first}} to {{last}}{{continues}}; every user prompt
  and final answer verbatim, tool rounds one line each;
  recall_turn(n, conversation="{{conversation_id}}") re-reads any turn
  whole]

continue_continues: >-
  , itself continuing {{ids}}

continue_note: >-
  [its handoff note, written {{written}} by {{actor}}]

continue_note_end: >-
  [end of note]

continue_footer: >-
  [end — you are continuing this conversation: carry on from its last
  answer as the same work, in the same voice; the user's next message is
  its next turn]

handoff_recorded: >-
  [handoff note recorded — the next session in this scope sees it at
  start, and continue_session() there delivers this conversation]

handoff_guide: >-
  Say what the next agent needs, not a summary of the chat: what was
  being done and for whom, what is done (the paths, ids and commands
  that matter), what is next (the first step precisely), what is open
  or blocked. The record holds every turn: name turns as [n] rather than
  repeating them.
