# Model-facing descriptions of the built-in tools (ECOSYSTEM §8).

skill_list: "List the available skills — reusable instructions — with their names and descriptions. A skill kept in a memory mount also shows its path (/mount/skills/name) and version. Use this to discover what is available before loading one."

skill_load: "Load a skill by name, or by its /mount/skills/name path. Returns the full instructions; for a skill in a mount the reminder names the document, so you can revise it with the memory tool. Use list_skills first to see what's available."

skill_guide: |-
  To add a skill, create /<mount>/skills/<name> with the memory tool: a
  frontmatter block whose `description` says when to use it, then the
  instructions as the body. Revise one with str_replace on its path; a
  read-only mount's skills are fixed. For example:
  ---
  description: Release this project
  ---
  1. Bump the version ...

recall_turn_any: "Re-read one turn of a recorded conversation. Every agent's sessions are listed in the memory index under sessions/ (each document names its conversation id), and the 'where we left off' block at session start shows each turn as one line labeled with its number in square brackets, e.g. [7]. Pass the conversation id and a turn number. The default view, light, shows the user prompts and the agent's replies verbatim and each tool call as one line: its tool, the head of its arguments, the head and tail of its result, the result's size and the call that opens it; it stops at 64 KiB and names the record the turn goes on from. view=prompts shows the user prompts only; view=calls adds every call with its arguments whole and each result as its size; view=full shows the whole turn, a result over 4 KiB as its head and tail. call=<id> opens that call's result and seq=<n> opens the piece holding record n (a search hit or a marker names it) from its beginning: each answers one part of at most 64 KiB, and when more follows a marker names the part=<n> that continues it. Reasoning, attachments and other opaque data are never shown. Use it whenever a log line mentions something you need the details of, and to read the URL, path or id a [link <id>:N] handle stands for."

recall_turn_light: "Turn {{turn}} (light: prompts and replies verbatim, one line per tool call):"
recall_turn_prompts: "Turn {{turn}} (prompts):"
recall_turn_calls: "Turn {{turn}} (calls: prompts, replies and every call whole, results by size):"
recall_turn_full: "Turn {{turn}} (verbatim):"
recall_turn_empty: "[nothing of this view in this turn]"
recall_turn_result: "[{{bytes}} bytes; pass {{selector}} to read it]"
recall_turn_omitted: " … [{{bytes}} of {{size}} bytes omitted; pass {{selector}} to read it in parts] … "
recall_turn_light_end: "[the light view stops at {{limit}} bytes; the turn goes on from record {{seq}}: pass seq={{seq}} to read that piece, or view=\"calls\" or view=\"full\" for the rest]"
recall_turn_call: "Turn {{turn}}, call {{call}}{{part}} (verbatim):"
recall_turn_seq: "Turn {{turn}}, seq {{seq}}{{part}} (verbatim):"
recall_turn_part: ", part {{part}}"
recall_turn_more: "… [part {{part}} of {{piece}} of {{bytes}} bytes; pass part={{next}} to continue]"
recall_turn_last: "… [part {{part}}, the last, of {{piece}} of {{bytes}} bytes]"
recall_turn_whole: "[this turn cannot be shown in views; it is shown whole, as recorded]"
recall_turn_whole_hint: "This turn cannot be shown in views or opened by seq or in parts: recall it in any view to read it whole, or with call alone to read one result whole."
recall_turn_numbers_hint: "Turn numbers appear in square brackets in the conversation log, e.g. [7] or [3-6]."
recall_turn_selectors_hint: "call opens one tool call's result by its id; seq opens the piece holding one record, as a search hit or a marker names it."
recall_turn_parts_hint: "part counts the parts of the piece that call or seq opens, from 0; each part's marker names the next."
recall_turn_view_hint: "Pass view alone to show the whole turn, or call or seq, with part, to open one piece."
recall_turn_no_result_hint: "Its arguments are shown with view=\"calls\"."
recall_turn_unshown_hint: "recall_turn shows prompts, replies, system messages, tool calls and tool results; reasoning, attachments and other opaque data stay out."
recall_turn_pieces:
  prompt: "a prompt"
  reply: "a reply"
  system: "a system message"
  tool_call: "a call's arguments"
  tool_result: "a result"

search_history_any: "Search every recorded conversation for turns by their words (case-insensitive substrings, separated by spaces): message text, tool calls with their arguments, and tool results. Results rank best match first by default: a turn needs only one term and rarer terms count more, so add synonyms to one query. order=newest lists turns holding every term, newest first. since and before limit turn time (UTC, ending in Z); before is an exact as-of cutoff. Each hit names the conversation and turn, e.g. [cc-7f3a #2], with a snippet around the match; pass that id and number to recall_turn to read the turn verbatim. Use it when the memory index and the 'where we left off' block do not say where something happened, or when a fact lives in a session older than the ones shown. Pass conversation=<id> to search one session; limit caps the hits (default 10, at most 50). A later turn can supersede an earlier one, so check newer hits before relying on an older fact."

search_history_footer: "[newest first, at most {{shown}}; call recall_turn(n, conversation=\"<id>\") to re-read a hit verbatim]"
search_history_footer_ranked: "[best match first, at most {{shown}}; call recall_turn(n, conversation=\"<id>\") to re-read a hit verbatim]"
search_history_fallback: "[this store does not support history-ranking version 1; newest first]"
search_history_blank_ranked: "Terms are case-insensitive substrings separated by spaces; in best match order one term is enough."
search_history_none_ranked: "No turn matches any term: {{terms}}. In best match order one term is enough (case-insensitive substrings); try different or more terms."
search_history_too_broad: "Too many turns hold one of these terms for this server to rank them. Search again with rarer, more specific terms (drop common words and single letters), limit the time with since and before, or pass conversation=<id>. order=newest, which needs every term, is not limited this way."
search_history_too_broad_cli: "Too many turns hold one of these terms for this server to rank them. Search again with rarer, more specific terms (drop common words and single letters), limit the time with --since and --before, or name a --conversation. --order newest, which needs every term, is not limited this way."

continue_session: "Continue a recorded conversation: the one call to make when the user says to continue, carry on, pick up or resume where another session (any agent) left off. Delivers that conversation whole, within a budget: every user prompt and final answer verbatim, tool rounds as one line each, the older turns as one-line log entries; its handoff note first when one is pending, which this call picks up. Omit conversation to continue the session the pending note names, else the most recent session listed in the memory index under sessions/; pass conversation=<id> to continue that one. Afterwards carry on as the same work. Never call it for new work: a session that continues nothing is a new session."

continue_session_params:
  session: "Your exact current session ID from the session hook, for immediate continuation routing."
  conversation: "The conversation id to continue, as the sessions/ document or the handoff note names it; omit for the pending note's session, else the most recent one listed."

handoff: "Write the handoff note for whoever continues this work next, in any agent: call it when the user says to hand off, wrap up for the next session, or leave a note for later. The note is shown in full at the next session start in this scope until a session picks it up with continue_session. Under 2048 characters: what was being done and for whom, what is done (the paths, ids and commands that matter), what is next (the first step precisely), what is open or blocked; name turns as [n] instead of repeating them. One note stands per scope: a new one replaces it (the old one stays as a version)."

handoff_params:
  note: "The note, under 2048 characters: what was being done, what is done, what is next, what is open."

skill_load_params:
  name: "The skill's name as listed by list_skills, or its /mount/skills/name path."

recall_turn_any_params:
  turn: "The turn number shown in square brackets in the session's log, e.g. 7 for [7]."
  conversation: "The conversation id, as the sessions/ document or the view names it."
  call: "The id of one tool call of that turn, as a light line or a marker names it: opens that call's result, one part of at most 64 KiB at a time."
  view: "light (the default when omitted): prompts and replies verbatim, one line per tool call; prompts: the user prompts only; calls: also every call's arguments whole and each result's size; full: the whole turn, a long result as its head and tail."
  seq: "A record of that turn, as a search hit or a marker names it: opens the piece holding it from its beginning, one part of at most 64 KiB at a time."
  part: "Which part of the piece that call or seq opens, counted from 0 (the default); each part's marker names the next."

search_history_any_params:
  query: "One or more terms separated by spaces, case-insensitively; relevance needs one, newest every one."
  conversation: "The id of one conversation to search, as the sessions/ document names it; omit for every recorded conversation."
  limit: "How many hits to return (default 10, at most 50)."
  order: "relevance (the default when omitted): best match first; newest: every term, newest first."
  since: "Only turns at or after this UTC instant, RFC 3339 ending in Z."
  before: "Only turns before this UTC instant, RFC 3339 ending in Z: an exact as-of cutoff."

skill_context: |-
  Skill source and revision details follow. Dependencies have been checked;
  load their named instructions explicitly when needed. Supporting files are
  data readable through the memory tool, never automatically executed.

skill_refusal: |-
  Inspect the named skill and its dependencies with neosian skill inspect.
  Profile pins guard current source, version and content. Review changes before
  explicitly updating or removing a pin; erased content cannot be recovered.
