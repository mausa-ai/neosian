# The rename's sentences (DESIGN §40.53 item 4). Prose is data.
moved: "{{label}} moved to neosian."
allow: "{{place}} allows the old tool names; the client will ask again; rename the entry to keep it"
left: "{{label}} stays on neosian-memory, which keeps working."
mention: "{{place}} names neosian"
mention_unreadable: "{{path}} cannot be read, so whether it names neosian is unknown"
move_anyway: "To move it anyway (this list may be incomplete): neosian setup --refresh --rename"
taken: "the name neosian at {{place}} belongs to another server; rename or remove that server, then run neosian setup --refresh"
differ: "neosian-memory and neosian at {{place}} are both neosian's and differ; keep the one with every member you want, remove the other, then run neosian setup --refresh"
unreadable: "{{path}} cannot be read, and its text contains neosian-memory; fix the file so it reads, then run neosian setup --refresh"
receipt: "{{path}} cannot be read, so no entry under neosian can be known as neosian's; move it aside, then run neosian setup --refresh"
shared: "{{path}} is also read by {{other}}, which stays on neosian-memory in this run, so both stay"
held: "put back with neosian setup --undo-rename; run neosian setup --refresh --rename to move it again"
hosted: "{{place}} is a hosted entry under neosian-memory; neosian does not move it"
failed: "{{label}} could not move ({{error}}); it is back on neosian-memory."
not_utf8: "{{path}} is not valid UTF-8, so neosian cannot move the entry without changing other bytes"
unwritable: "{{path}} is not writable by its owner"
not_editable: "{{path}} holds the entry in a form neosian cannot edit in place (a key given twice, for example); fix the file, then run neosian setup --refresh"
undo_failed: "{{label}} could not go back ({{error}}); it is still on neosian."
moved_app_state: "If neosian was switched off in {{label}}'s own settings, check that it still is."
changed: "{{path}} changed while the rename ran"
cli_missing: "the claude CLI is not on PATH, and Claude Code's entries move through it"
cli_failed: "claude mcp failed: {{error}}"
cli_lost: "Claude's CLI did not keep every member of the entry ({{members}})"
cli_still_listed: "the entry is still listed after claude mcp remove"
toml_refused: "{{path}}: {{reason}}"
toml_both: "a Codex configuration holds neosian-memory and neosian; remove the earlier table by hand"
two: "two of neosian's servers are registered: neosian-memory at {{old}} and neosian at {{new}}; {{fix}}"
two_fix: "run neosian setup --refresh --rename to finish the move"
two_fix_here: "run neosian setup --refresh --rename in {{dir}} to finish the move there"
two_fix_hand: "neosian cannot change that file in place; delete neosian-memory there by hand"
on_new: "on neosian"
on_both: "on neosian and neosian-memory at once (see below)"
on_old: "on neosian-memory (the earlier name; it keeps working)"
setup_taken: "the name neosian in {{path}} is taken by another server; neosian does not write beside it, and an earlier neosian-memory registration keeps working"
setup_taken_fix: "rename that server, for example to neosian-cloud, or remove it, then run setup again"
setup_unreadable: "{{path}} cannot be read as the client reads it, so neosian cannot tell whether neosian there is another server's; nothing is written"
fix_unreadable: "fix the file so it reads as JSON, then run setup again"
fix_receipt: "move it aside, then run setup again"
two_fix_setup: "run neosian setup --refresh --rename to finish the move, then run setup again"
two_fix_setup_hand: "delete neosian-memory there by hand, then run setup again"
undone: "{{label}} is back on neosian-memory."
undo_refused: "{{place}}: neosian there is not the entry neosian wrote, or neosian-memory stands beside it; left as it is"
undo_none: "Nothing to put back: no client is on neosian with an entry neosian wrote."
backup_failed: "the rename's backup could not be written: {{error}}"
backup_fix: "free space or fix the permissions under the neosian home, then run neosian setup --refresh"
