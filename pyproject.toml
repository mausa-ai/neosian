# Python is for development and tests only; this is not a distribution.
[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26",
    "mypy>=2.3.1",
    "pip-audit>=2.9",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0.3",
    "referencing>=0.37",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --timeout=60"
markers = [
    "contract: Independent format and CLI/MCP/HTTP checks against the binary",
    "postgres: PostgreSQL corruption tests, explicitly selected with a test DSN",
]
testpaths = ["tests/contract", "tests/tooling"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
]

[tool.ruff.lint.isort]
# Keep explicit re-exports in one statement
combine-as-imports = true
