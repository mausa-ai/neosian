[project]
name = "neosian"
version = "0.83.1"
description = "Async-only library for LLM agents: tools, orchestration, streaming, guardrails — with opt-in conversation, memory, and compaction layers over a stateless core."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["llm", "agents", "memory", "conversation", "streaming", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.122.0",
    "cerebras-cloud-sdk>=1.91.0",
    "httpx>=0.28.1",
    "openai>=3.2.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "simple-term-menu>=1.6.6",
    "tomli-w>=1.2.0",
    "typer>=0.27.1",
]

# The reference PostgresStore rides the `postgres` extra; the core install
# stays driver-free (keyless boot never needs a database). The MCP memory
# server rides the `mcp` extra the same way — `import neosian` and
# `import neosian.mcp` stay SDK-free (pinned by subprocess tests) — and
# the OTel span exporter rides `otel` (api only; the SDK is the host's
# choice, dev-group here solely for the in-memory exporter tests). The
# state process rides `server` (DESIGN §18): starlette/uvicorn pinned
# explicitly, never leaned on as the MCP SDK's transitive deps;
# `RemoteStore` needs none of it — httpx is core.
[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2"]
mcp = ["mcp>=2,<3"]
otel = ["opentelemetry-api>=1.30"]
server = ["mcp>=2,<3", "starlette>=1.6", "uvicorn>=0.52.4"]

[project.urls]
Homepage = "https://github.com/neosae/neosian"
Repository = "https://github.com/neosae/neosian"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "import-linter>=2.13",
    "mcp>=2,<3",
    "mypy>=2.3.1",
    "opentelemetry-sdk>=1.30",
    "psycopg[binary,pool]>=3.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7",
    "pytest-timeout>=2.3",
    "ruff>=0.16.3",
    "starlette>=1.6",
    "types-pyyaml>=6.0.12.20250915",
    "uvicorn>=0.52.4",
]
examples = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[tool.coverage.run]
source = ["neosian"]

[tool.coverage.report]
skip_empty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not external' --strict-markers --timeout=60"
markers = [
    "unit: Fast tests on fakes only — the default, fully keyless gate",
    "external: Any test making real API calls (excluded by default)",
    "external_openai: Real OpenAI API calls",
    "external_anthropic: Real Anthropic API calls",
    "external_cerebras: Real Cerebras API calls",
    "external_xai: Real xAI API calls (shipped door)",
    "external_gemini: Real Gemini API calls (shipped door)",
    "external_kimi: Real Moonshot API calls (candidate door)",
    "external_postgres: A real PostgreSQL server (DSN env var, not an API key)",
    "external_server: A running state-process container (URL env var, not an API key)",
]
testpaths = ["tests"]
filterwarnings = [
    "default::DeprecationWarning",
    "error::DeprecationWarning:neosian.*",
    # last so it outranks the default:: entries above
    # create_autospec walks a pydantic instance's dir(); the SDK-spec mocks
    # (tests/unit/llm/sdk_specs.py) would otherwise emit this on every access
    "ignore:Accessing the 'model_(computed_)?fields' attribute:DeprecationWarning:unittest.mock",
    "ignore:The `__fields__` attribute is deprecated:DeprecationWarning:unittest.mock",
    "ignore:The `__fields_set__` attribute is deprecated:DeprecationWarning:unittest.mock",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "UP042",  # keep (str, Enum) — StrEnum changes str()/format semantics on
              # serialization-heavy public enums (Model, Role, AgentEventType)
]

[tool.ruff.lint.isort]
# `from m import X as X` re-exports stay one statement (shared/types.py)
combine-as-imports = true

# Layering (DESIGN §1) — forbidden contracts only. Type-only imports are
# excluded: the contracts police runtime coupling, and TYPE_CHECKING
# blocks (e.g. shared.types -> agent.hooks for AgentHooks) create none.
[tool.importlinter]
root_packages = ["neosian"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "the library never imports its CLI"
type = "forbidden"
source_modules = ["neosian._foundation"]
forbidden_modules = ["neosian._cli"]

# The facades re-export the foundation, never the reverse — an inversion
# would drag a facade's whole public surface into a foundation import.
[[tool.importlinter.contracts]]
name = "the foundation never imports the facades"
type = "forbidden"
source_modules = ["neosian._foundation"]
forbidden_modules = [
    "neosian.mcp",
    "neosian.memory",
    "neosian.evaluation",
    "neosian.conversation",
    "neosian.catalog",
    "neosian.fake",
    "neosian.schemas",
    "neosian.server",
]

[[tool.importlinter.contracts]]
name = "storage substrates speak only to ABCs, never provider internals"
type = "forbidden"
source_modules = [
    "neosian._foundation.memory",
    "neosian._foundation.postgres",
]
forbidden_modules = [
    "neosian._foundation.llm.openai",
    "neosian._foundation.llm.anthropic",
    "neosian._foundation.llm.cerebras",
    "neosian._foundation.llm.fake",
]

[[tool.importlinter.contracts]]
name = "the MCP server speaks only to the store and tool layers"
type = "forbidden"
source_modules = ["neosian._foundation.mcp"]
forbidden_modules = [
    "neosian._foundation.agent",
    "neosian._foundation.llm.openai",
    "neosian._foundation.llm.anthropic",
    "neosian._foundation.llm.cerebras",
    "neosian._foundation.llm.fake",
]

# The record verb writes what a foreign agent's hooks report: the store
# and the message codec, never the agent, a provider, or the MCP SDK (§20.9).
[[tool.importlinter.contracts]]
name = "the record verb speaks only to the store and codec layers"
type = "forbidden"
source_modules = ["neosian._foundation.record"]
forbidden_modules = [
    "neosian._foundation.agent",
    "neosian._foundation.mcp",
    "neosian._foundation.llm.openai",
    "neosian._foundation.llm.anthropic",
    "neosian._foundation.llm.cerebras",
    "neosian._foundation.llm.fake",
]

# The state process is a storage surface: the wire mirrors the ABCs and
# every MCP call rides the shared dispatcher — never the agent (§18).
[[tool.importlinter.contracts]]
name = "the state process speaks only to the store and tool layers"
type = "forbidden"
source_modules = ["neosian._foundation.server"]
forbidden_modules = [
    "neosian._foundation.agent",
    "neosian._foundation.llm.openai",
    "neosian._foundation.llm.anthropic",
    "neosian._foundation.llm.cerebras",
    "neosian._foundation.llm.fake",
]

# Conversation drives an Agent, which owns the router — the direct edge
# is the honest one to police (ledger #26).
[[tool.importlinter.contracts]]
name = "the conversation layer never imports provider clients directly"
type = "forbidden"
source_modules = ["neosian._foundation.conversation"]
forbidden_modules = [
    "neosian._foundation.llm.openai",
    "neosian._foundation.llm.anthropic",
    "neosian._foundation.llm.cerebras",
    "neosian._foundation.llm.fake",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the conversation storage seam never imports the agent"
type = "forbidden"
source_modules = [
    "neosian._foundation.conversation.base",
    "neosian._foundation.conversation.types",
    "neosian._foundation.conversation.ids",
    "neosian._foundation.conversation.file_turns",
    "neosian._foundation.conversation.testing",
    "neosian._foundation.conversation.projection",
    "neosian._foundation.conversation.distill",
    "neosian._foundation.conversation.compaction",
    "neosian._foundation.conversation.reflection",
    "neosian._foundation.conversation.recall",
    "neosian._foundation.postgres",
]
forbidden_modules = ["neosian._foundation.agent"]

[[tool.importlinter.contracts]]
name = "the runtime library never imports the eval harness"
type = "forbidden"
source_modules = [
    "neosian._foundation.agent",
    "neosian._foundation.blackboard",
    "neosian._foundation.conversation",
    "neosian._foundation.guardrails",
    "neosian._foundation.llm",
    "neosian._foundation.mcp",
    "neosian._foundation.memory",
    "neosian._foundation.postgres",
    "neosian._foundation.server",
    "neosian._foundation.shared",
    "neosian._foundation.tools",
]
forbidden_modules = ["neosian._foundation.evaluation"]

# The harness drives an Agent and scripts the fake — llm.fake is its
# legitimate seam; the four real clients never are.
[[tool.importlinter.contracts]]
name = "the eval harness never imports provider clients directly"
type = "forbidden"
source_modules = ["neosian._foundation.evaluation"]
forbidden_modules = [
    "neosian._foundation.llm.openai",
    "neosian._foundation.llm.anthropic",
    "neosian._foundation.llm.cerebras",
]
allow_indirect_imports = true

# The OTel exporter observes through the hook seam only (ledger #83) —
# never the orchestration it observes, the providers, or the layers.
[[tool.importlinter.contracts]]
name = "the OTel exporter speaks only to the hook seam"
type = "forbidden"
source_modules = ["neosian._foundation.otel"]
forbidden_modules = [
    "neosian._foundation.llm.openai",
    "neosian._foundation.llm.anthropic",
    "neosian._foundation.llm.cerebras",
    "neosian._foundation.conversation",
    "neosian._foundation.memory",
    "neosian._foundation.postgres",
    "neosian._foundation.mcp",
    "neosian._foundation.evaluation",
    "neosian._foundation.guardrails",
]

[project.scripts]
neosian = "neosian._cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
