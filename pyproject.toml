[project]
name = "neosian"
version = "0.56.0"
description = "Stateless agentic AI library. LLM orchestration, tool execution, streaming."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "cerebras-cloud-sdk>=1.91.0",
    "groq>=1.6.0",
    "httpx>=0.28.1",
    "openai>=3.2.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "simple-term-menu>=1.6.6",
    "tomli-w>=1.2.0",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "import-linter>=2.13",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not external' --strict-markers"
markers = [
    "unit: Fast tests on fakes only — the default, fully keyless gate",
    "external: Any test making real API calls (excluded by default)",
    "external_groq: Real Groq API calls",
    "external_openai: Real OpenAI API calls",
    "external_anthropic: Real Anthropic API calls",
    "external_cerebras: Real Cerebras API calls",
]
testpaths = ["tests"]
filterwarnings = [
    "default::DeprecationWarning",
    "error::DeprecationWarning:neosian.*",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "UP042",  # keep (str, Enum) — StrEnum changes str()/format semantics on
              # serialization-heavy public enums (Model, Role, AgentEventType)
]

# Layering (DESIGN §1) — forbidden contracts only. The memory/Conversation ↛
# provider-internals contract lands with the memory module in N1 (import-linter
# rejects contracts naming modules that do not exist yet).
[tool.importlinter]
root_packages = ["neosian"]

[[tool.importlinter.contracts]]
name = "the library never imports its CLI"
type = "forbidden"
source_modules = ["neosian._foundation"]
forbidden_modules = ["neosian._cli"]

[project.scripts]
neosian = "neosian._cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
