# Product version authority. One binary, no embedding SDK.
[workspace]
members = ["crates/neosian"]
resolver = "3"

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.99.0"
authors = ["Mausa <community@neosian.com>"]
license = "Apache-2.0"
repository = "https://github.com/mausa-ai/neosian"
homepage = "https://neosian.com"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The profile cargo-dist builds the shipped binaries with
[profile.dist]
inherits = "release"
