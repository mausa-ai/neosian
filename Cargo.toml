# The Rust workspace (DESIGN §39, ledger #338): one crate today, the
# product doors as one static binary. The version is the wheel's, a
# unit test keeps the two literals equal; the toolchain is
# rust-toolchain.toml's pin and `rust-version` names the same release.
[workspace]
members = ["crates/neosian"]
resolver = "3"

[workspace.package]
version = "1.9.0"
edition = "2024"
rust-version = "1.99.0"
authors = ["Mausa <community@neosian.com>"]
license = "Apache-2.0"
repository = "https://github.com/mausa-ai/neosian"
homepage = "https://neosian.com"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The profile cargo-dist builds the shipped binaries with
[profile.dist]
inherits = "release"
