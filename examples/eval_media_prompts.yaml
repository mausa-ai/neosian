# Evaluation: compare prompt variants for the media agent (schema v2)
#
# Tests how different prompting styles affect tool selection accuracy:
# - minimal: bare-minimum descriptions
# - verbose: detailed descriptions with examples
# - with_hints: rules-heavy prompt with follow-up guidance in the descriptions
#
# Run: neosian eval examples/eval_media_prompts.yaml

name: Media Agent Prompt Comparison

agent: examples/media_agent.py

variants:
  - name: minimal
    prompt: examples/prompts/minimal.yaml
  - name: verbose
    prompt: examples/prompts/verbose.yaml
  - name: with_hints
    prompt: examples/prompts/with_hints.yaml

models:
  - cerebras:gpt-oss-120b

ignore_tools: [update_todo]

cases:
  # Basic tool selection
  - name: image_generation
    input: "Create a beautiful sunset over mountains"
    expect:
      tool: generate_image
      params:
        prompt: _exists

  - name: image_edit
    input: "Make that image wider, like a panorama"
    expect:
      tool: generate_image
      params:
        prompt: _exists
        aspect_ratio: _exists

  - name: tts_basic
    input: "Read this aloud: Hello, welcome to our service!"
    expect:
      tool: generate_tts
      params:
        text: _exists

  - name: tts_with_voice
    input: "Say 'Good morning everyone' in Brian's voice"
    expect:
      tool: generate_tts
      params:
        text: _exists
        voice: {equals: Brian}

  - name: video_from_text
    input: "Create a video of a cat playing with yarn"
    expect:
      tool: generate_video
      params:
        prompt: _exists

  - name: music_generation
    input: "Make some relaxing piano music"
    expect:
      tool: generate_music
      params:
        prompt: _exists

  # Edge cases — should NOT call tools
  - name: greeting_no_tool
    input: "Hello! How are you today?"
    expect:
      no_tool: true

  - name: question_no_tool
    input: "What kinds of images can you create?"
    expect:
      no_tool: true

  # Ambiguous requests — tests understanding
  - name: animate_request
    input: "Can you bring this picture to life?"
    expect:
      tool: generate_video

  - name: audio_ambiguous
    input: "I need some background audio for my video"
    expect:
      tool: generate_music

  # Conversational: image → video flow. The turn-1 stub returns the URL
  # the model must thread into turn 2.
  - name: conv_image_to_video
    conversation:
      - user: "Generate an image of a sunset over the ocean"
        expect:
          tool: generate_image
          params:
            prompt: _exists
        tool_results:
          generate_image:
            image_url: "https://mock.cdn/sunset-ocean-abc123.png"
      - user: "Now turn that into a video"
        expect:
          tool: generate_video
          params:
            image_url: {equals: "https://mock.cdn/sunset-ocean-abc123.png"}

  # Conversational: TTS voice-change flow
  - name: conv_tts_voice_change
    conversation:
      - user: "Say 'Hello world' out loud"
        expect:
          tool: generate_tts
          params:
            text: _exists
        tool_results:
          generate_tts:
            audio_url: "https://mock.cdn/hello-world.mp3"
      - user: "That was good, but can you say it in a deeper voice?"
        expect:
          tool: generate_tts
          params:
            text: _exists
