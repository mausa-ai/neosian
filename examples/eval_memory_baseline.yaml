# Memory eval baseline (kind: memory, schema v2) — DESIGN §13.12.
#
# Ten scenarios, one per measured behavior: write discipline,
# recall-in-next-session, dedup, contradiction handling, long-horizon
# recall, correcting a wrong memory, reflection at the session boundary
# (§15), maintenance over a seeded store (§16), the cross-client
# switch — a foreign agent's hook-fed session recalled by a neosian
# agent (§21.7) — and skills written, loaded and revised as documents in
# a mount (§24). Every agent session is scripted, so the pack runs
# keylessly on FakeProvider and is all-green by construction — a red
# run is a regression. Turn expectations stay loose (they must survive
# a real provider); the store truth carries the strictness.
#
# The external baselines derive a scriptless copy of this same pack in
# code (tests/external/cross/test_memory_baselines.py) — one source of
# scenario truth for the fake-vs-real comparison.
#
# Run: neosian eval examples/eval_memory_baseline.yaml
# Scenario stores land under .neosian/evals/<ts>-memory/ — cat them.

kind: memory
name: Memory Baseline

# An AgentConfig WITHOUT memory= — this suite owns the store and mounts.
agent: examples/eval_memory_agent.py

models: [fake]

# The transport axis. The cli transport (the `neosian memory` engine,
# run in-process — DESIGN §14.3), the http transport (the memory tool
# over `RemoteStore` against an in-process state process — DESIGN §18,
# ledger #113) and the mcp transport (the memory server consumed
# through `McpServer` over the official client — DESIGN §25) are
# provider-independent, so they belong in the keyless gate beside the
# function tool; native_memory stays off the pack because it is inert
# off Anthropic.
transports: [function, cli, http, mcp]

mounts:
  - scope: user:eval
    mount_path: user
    description: durable facts about the user
  - scope: user:eval/proj:demo
    mount_path: project
    description: facts about this project

scenarios:
  # WRITE DISCIPLINE — right mount, one document per topic, corrections
  # edit in place, and nothing the user refused ever lands in the store.
  - name: write-discipline
    sessions:
      - name: record
        turns:
          - user: >-
              I only drink espresso. This project runs on Postgres 16.
              My token is sk-eval-secret-000 — don't save that.
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: create
                  path: /user/preferences
                  content: "Drinks espresso only."
              - name: memory
                arguments:
                  command: create
                  path: /project/stack
                  content: "Runs on Postgres 16."
          - content: "Noted — the token is not stored."
        # Document naming is the model's choice — store truth pins the
        # region and the fact (path_prefix: exactly one live document
        # under the prefix matches), never the file name. /user is
        # deliberately uncounted: recording the privacy instruction as
        # its own note beside the preference is memory-worthy, ruled
        # legitimate (2026-08-21 — gpt-5-mini did exactly that on both
        # first dispatches); the exactly-one-espresso-match rule keeps
        # the dedup bite and `forbidden` keeps the no-secrets bite.
        expect_store:
          counts: {/project: 1}
          documents:
            - path_prefix: /user
              content: {contains: espresso}
              versions: 1
              actions: [created]
            # regex, not contains: models normalize wordforms and phrase
            # freely ("PostgreSQL 16", "PostgreSQL version: 16" observed;
            # a live /project/postgres.txt the 24-char one-line pin still
            # refused, dispatch #11) — pin the fact, not the spelling:
            # "v16", "Postgres16", a bullet on the next line all count.
            - path_prefix: /project
              content: {regex: "(?i)postgres(ql)?[\\s\\S]{0,40}?v?16\\b"}
          forbidden: [sk-eval-secret-000]

      - name: correct
        turns:
          - user: "Correction: the project moved to Postgres 17."
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: str_replace
                  path: /project/stack
                  old_str: "Postgres 16"
                  new_str: "Postgres 17"
          - content: "Updated."
        # End-state truth only: still one project document and it now
        # says 17. How many edits that took is churn, and "17 (upgraded
        # from 16)" is provenance, not a failure — the first real runs
        # showed models annotating transitions (ledger #82's spirit).
        expect_store:
          counts: {/project: 1}
          documents:
            - path_prefix: /project
              content: {regex: "(?i)postgres(ql)?[\\s\\S]{0,40}?v?17\\b"}

  # RECALL IN THE NEXT SESSION — session 2 gets a freshly regenerated
  # index, reads the document back rather than guessing, and writes
  # nothing to answer.
  - name: recall-next-session
    sessions:
      - name: record
        turns:
          - user: "Remember that my daughter's name is Mira."
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: create
                  path: /user/family
                  content: "Daughter: Mira."
          - content: "Saved."
        expect_store:
          documents:
            - path_prefix: /user
              content: {contains: Mira}
              versions: 1
      - name: recall
        turns:
          - user: "What is my daughter's name?"
            expect:
              tool: memory
              params: {command: view}
              response: {contains: Mira}
        script:
          - tool_calls:
              - name: memory
                arguments: {command: view, path: /user/family}
          - content: "Your daughter is Mira."
        # versions stays 1: answering must read the fact back, never
        # rewrite it.
        expect_store:
          counts: {/user: 1}
          documents:
            - path_prefix: /user
              content: {contains: Mira}
              versions: 1

  # DEDUP — a second fact on the same topic updates the existing
  # document; a near-duplicate at a new path is the failure.
  - name: dedup
    sessions:
      - name: first-fact
        turns:
          - user: "I'm allergic to peanuts."
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: create
                  path: /user/health
                  content: "Allergic to peanuts."
          - content: "Noted."
        expect_store:
          counts: {/user: 1}
      - name: second-fact
        turns:
          - user: "Also allergic to shellfish."
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments: {command: view, path: /user/health}
              - name: memory
                arguments:
                  command: str_replace
                  path: /user/health
                  old_str: "Allergic to peanuts."
                  new_str: "Allergic to peanuts and shellfish."
          - content: "Updated your health notes."
        # The dedup signal is structural: one live document under /user
        # holds both facts — a near-duplicate at any second path fails
        # the count and the exactly-one-match rule.
        # "peanut" not "peanuts": models normalize wordforms ("Peanut
        # allergy" observed) — substring matching pins the fact.
        expect_store:
          counts: {/user: 1}
          documents:
            - path_prefix: /user
              content:
                contains: [peanut, shellfish]

  # CONTRADICTION HANDLING — a stated fact reverses; the single user
  # document carries the current fact. "Lisbon (moved from Paris)" is
  # a good update — annotated provenance is not a failure, so no
  # forbidden pin on the old value; the duplicate-document failure is
  # what the count and exactly-one-match rules catch.
  - name: contradiction
    sessions:
      - name: record
        turns:
          - user: "I live in Paris."
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: create
                  path: /user/location
                  content: "Lives in Paris."
          - content: "Noted."
        expect_store:
          counts: {/user: 1}
          documents:
            - path_prefix: /user
              content: {contains: Paris}
              versions: 1
      - name: contradict
        turns:
          - user: "Actually I've moved — I live in Lisbon now."
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: str_replace
                  path: /user/location
                  old_str: "Lives in Paris."
                  new_str: "Lives in Lisbon."
          - content: "Updated — Lisbon it is."
        expect_store:
          counts: {/user: 1}
          documents:
            - path_prefix: /user
              content: {contains: Lisbon}

  # LONG-HORIZON RECALL — the fact from session 1 survives two
  # intervening sessions of unrelated writes; the final session views
  # the right document and answers without writing. Filing granularity
  # is the model's (one consolidated project doc or two separate ones
  # are both disciplined — observed both ways in the first real runs),
  # so the distractor pins are content presence, not document counts.
  - name: long-horizon-recall
    sessions:
      - name: record
        turns:
          - user: "My cat is called Biscuit."
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: create
                  path: /user/pets
                  content: "Cat: Biscuit."
          - content: "Saved."
        expect_store:
          documents:
            - path_prefix: /user
              content: {contains: Biscuit}
              versions: 1
      - name: distractor-one
        turns:
          - user: "Note that this project's API rate limit is 60 requests per minute."
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: create
                  path: /project/limits
                  content: "API rate limit: 60 requests/minute."
          - content: "Noted."
        expect_store:
          documents:
            - path_prefix: /project
              content: {contains: "60 requests"}
      - name: distractor-two
        turns:
          - user: "Also note we deploy from the main branch only."
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: create
                  path: /project/deploy
                  content: "Deploys from the main branch only."
          - content: "Noted."
        # regex: models decorate and reorder ("the `main` branch",
        # "Deployment branch: main" — both observed), and the recurring
        # red (dispatches #5, #13, the NZ settling run) was a document
        # named deployment_branch whose whole body is `main` — the path
        # the key, the body the value. Naming is the model's, so the pin
        # is the value in the project region, never the phrasing.
        expect_store:
          documents:
            - path_prefix: /project
              content: {regex: "(?i)\\bmain\\b"}
      - name: recall
        turns:
          - user: "What is my cat's name?"
            expect:
              tool: memory
              params: {command: view}
              response: {contains: Biscuit}
        script:
          - tool_calls:
              - name: memory
                arguments: {command: view, path: /user/pets}
          - content: "Your cat is Biscuit."
        # The user fact is exactly as session 1 left it — recall
        # reads, it never rewrites.
        expect_store:
          counts: {/user: 1}
          documents:
            - path_prefix: /user
              content: {contains: Biscuit}
              versions: 1

  # CORRECTING A WRONG MEMORY — the user disavows a stored note; the
  # discipline is delete-what-proved-wrong, not a softened edit. The
  # record turn asks for the note explicitly — the first real runs
  # showed a model reasonably declining to store a mere musing, and
  # this scenario measures the correction, not memory-worthiness.
  - name: correct-wrong-memory
    sessions:
      - name: record
        turns:
          - user: "Note down that this project is migrating to MongoDB."
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: create
                  path: /project/database-plan
                  content: "Migrating to MongoDB."
          - content: "Noted."
        expect_store:
          documents:
            - path_prefix: /project
              content: {contains: MongoDB}
              versions: 1
      - name: disavow
        turns:
          - user: "That MongoDB note is wrong — we're not migrating. Delete it completely."
            expect: {tool: memory}
        script:
          - tool_calls:
              - name: memory
                arguments: {command: delete, path: /project/database-plan}
          - content: "Removed."
        # Delete-what-proved-wrong: no live project document remains
        # and the claim survives in no live text.
        expect_store:
          counts: {/project: 0}
          forbidden: [MongoDB]

  # REFLECTION — the §15 session boundary: facts stated in passing reach
  # the store through the close's distillation, dedup-disciplined and
  # with the refused token kept out. Turn expectations are deliberately
  # bare (`response: {exists: true}`): a real model may legitimately
  # also write in-session — reflection must then update, not duplicate —
  # so store truth pins content and the forbidden rule only: no counts
  # (a token-free note recording the privacy instruction is
  # memory-worthy — the 2026-08-21 write-discipline ruling, extended
  # here by user ruling 2026-08-22), no versions or actions
  # (in-session and boundary writes produce different, equally correct
  # histories). Dedup keeps its bite through exactly-one-match: a
  # duplicated drink document is two matches under /user. The scripted
  # path pins the pure-boundary case: no tool call in the session, the
  # close writes everything.
  - name: reflection-close
    sessions:
      - name: chat
        reflect: true
        turns:
          - user: >-
              I only drink espresso, by the way. And my token is
              sk-eval-secret-000 — never save that anywhere.
            expect: {response: {regex: "\\S"}}
        script:
          - content: "Espresso only — understood, and the token stays out."
          - content: '{"ops": [{"command": "create", "path": "/user/preferences",
              "content": "Drinks espresso only."}]}'
        expect_store:
          documents:
            - path_prefix: /user
              content: {contains: espresso}
          forbidden: [sk-eval-secret-000]

      - name: revise
        reflect: true
        turns:
          - user: "Actually, make that ristretto from now on."
            expect: {response: {regex: "\\S"}}
        script:
          - content: "Ristretto it is."
          - content: '{"ops": [{"command": "str_replace", "path": "/user/preferences",
              "old_str": "espresso", "new_str": "ristretto"}]}'
        # Update-not-duplicate at the boundary: exactly one user
        # document carries the current preference.
        expect_store:
          documents:
            - path_prefix: /user
              content: {contains: ristretto}

  # MAINTENANCE — the §16 gardener over a seeded, deliberately polluted
  # store. Seeds are planted before session 1 (actor eval:seed), 30 days
  # old unless said otherwise. The byte-identical duplicate and the
  # whitespace-only document fall to the deterministic stage — keyless,
  # model-independent; the misfiled user-durable fact is the model
  # stage's promotion (a cross-mount rename); the fresh document sits
  # inside the deletion floor, so protection is measured, never
  # asserted. Store truth pins counts, the promoted content under its
  # prefix, and the pollution's absence — never the promoted document's
  # name (naming is legitimately the model's, ledger #82).
  - name: maintenance
    seed:
      - path: /user/coffee
        content: "Drinks espresso only."
      - path: /user/coffee-copy
        content: "Drinks espresso only."
      - path: /user/scratch
        content: " "
      - path: /project/timezone
        content: "The user's timezone is Europe/Paris."
      - path: /user/fresh-note
        content: "Reviewing the Q3 report this week."
        age_days: 0
    sessions:
      - name: garden
        maintain: true
        script:
          - content: '{"ops": [{"command": "rename", "old_path": "/project/timezone",
              "new_path": "/user/timezone"}]}'
        # Three survivors: the kept duplicate, the promoted fact, the
        # protected fresh note. Two would mean protection failed; the
        # absences pin the dedup, the prune, and the promotion's source.
        expect_store:
          counts: {/user: 3, /project: 0}
          documents:
            - path_prefix: /user
              content: {contains: Europe/Paris}
          absent: [/user/coffee-copy, /user/scratch, /project/timezone]

  # CROSS-CLIENT — the measured switching claim (VISION): a Claude Code
  # session lands through the record verb's engine (its hooks' three
  # payloads, no model in the room), then a neosian agent starts the way
  # a hook-fed agent starts — the index plus "where we left off" in its
  # prefix — and must re-read the foreign turn through the server's
  # recall_turn (conversation required). The asked-for detail sits past
  # the log line's 200-char digest and is in no document, so only the
  # verbatim turn can answer it: a right answer is the recall, whatever
  # the agent reads first (Sonnet views the sessions document before it
  # recalls — a first-tool pin would call that a miss). The pin is the
  # ticket's digits, the one spelling no model restyles. Store truth pins
  # the sessions document the record wrote and that reading never writes.
  - name: cross-client
    sessions:
      - name: claude-code-writes
        record:
          agent: claude-code
          session_id: cc-7f3a
          prompt: "Add a retry to the fetch helper."
          tools:
            - name: Edit
              input: {file_path: src/fetch.py}
              response: "ok"
              id: toolu_01retry
          stop: >-
            Added a retry to fetch(): three attempts with exponential
            backoff starting at 200 ms, doubling each time, plus a small
            random jitter so concurrent callers do not retry in lockstep;
            the tests cover the success-after-two-failures path. Tracked
            as FETCH4821.
        expect_store:
          documents:
            - path: /project/sessions/cc-7f3a
              content: {contains: "claude-code"}
              versions: 1
      - name: neosian-recalls
        session_start: true
        turns:
          - user: >-
              Which ticket did the last Claude Code session file its
              fetch.py change under? If the summary you were given does
              not say, re-read that session's turn.
            expect:
              response: {contains: "4821"}  # the digits: Sonnet restyles the key as FETCH-4821
        script:
          - tool_calls:
              - name: recall_turn
                arguments: {turn: 1, conversation: cc-7f3a}
          - content: "It was filed under FETCH4821 — a retry with exponential backoff in fetch()."
        # Reading never writes: the sessions document is the one live
        # document under /project (the mount at /project takes it, §22).
        expect_store:
          counts: {/project: 1}

  # SKILLS — a skill is a document under skills/ in a mount (§24): the
  # agent writes one through the memory tool with the frontmatter the
  # guide names, loads it by name in the next session, and revises it in
  # place — versions accrue on the one document. Store truth pins the
  # convention (a frontmatter description, under /project/skills/), the
  # history [created, modified], and that loading never writes; the name
  # is the model's (path_prefix). No turn carries a tool pin: the
  # matcher's rule is the *first* tool, and dispatch #11 showed Sonnet,
  # grok and kimi listing skills before a correct write (BASELINES) — a
  # right answer the first-tool pin would call a miss, the cross-client
  # lesson again. The turns keep only a loose response word; the store
  # carries the whole verdict.
  - name: skills
    sessions:
      - name: write
        turns:
          - user: >-
              Save a reusable skill for releasing this project: bump the
              version, run make test, then tag the release.
            expect: {response: {regex: "(?i)release"}}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: create
                  path: /project/skills/release
                  content: "---\ndescription: Release this project\n---\n1. Bump the version.\n2. Run make test.\n3. Tag the release."
          - content: "Saved as the release skill."
        expect_store:
          counts: {/project: 1}
          documents:
            - path_prefix: /project/skills/
              content: {contains: "description:"}
              versions: 1
              actions: [created]

      - name: use
        turns:
          - user: "How do I release this project? Use the skill."
            expect: {response: {regex: "(?i)test"}}
        script:
          - tool_calls:
              - name: load_skill
                arguments: {name: release}
          - content: "Bump the version, run make test, then tag the release."
        expect_store:
          counts: {/project: 1}
          documents:
            - path_prefix: /project/skills/
              versions: 1

      - name: revise
        turns:
          - user: >-
              Add a final step to the release skill: push with
              --follow-tags.
            expect: {response: {regex: "(?i)push"}}
        script:
          - tool_calls:
              - name: memory
                arguments:
                  command: str_replace
                  path: /project/skills/release
                  old_str: "3. Tag the release."
                  new_str: "3. Tag the release.\n4. Push with --follow-tags."
          - content: "Added the push step to the release skill."
        expect_store:
          counts: {/project: 1}
          documents:
            - path_prefix: /project/skills/
              content: {contains: "follow-tags"}
              versions: 2
              actions: [created, modified]
