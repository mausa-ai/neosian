<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     fill="none" stroke="currentColor" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- Keep — the neosae "n" (Seam: two arcs of ONE circle, centre (32, 31),
       radius 17, cut at the apex, a straight tangent leg on each outer end)
       plus the one point Seam never draws: the centre the arcs were struck
       from. Agents come and go; the store is what they were drawn around.

       The point is a zero-length stroke with a round cap, so it is the same
       6-unit weight as everything else and takes currentColor with it — the
       mark carries no colour of its own. The seam gap stays: it is what makes
       this a neosae mark first, and it closes into a solid n by ~110px by
       design; below that the point alone tells neosian from neosae. -->
  <path d="M 15 51 V 31 A 17 17 0 0 1 26.49 14.92" />
  <path d="M 37.51 14.92 A 17 17 0 0 1 49 31 V 51" />
  <path d="M 32 31 h 0.01" />
</svg>
