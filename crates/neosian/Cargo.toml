[package]
name = "neosian"
description = "The state layer for LLM agents, as one static binary: the record, memory and the state process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["agents", "memory", "mcp", "llm"]
categories = ["command-line-utilities"]

[package.metadata.wix]
upgrade-guid = "4F99CA3A-481B-4BC1-83A4-D24E8792A488"
path-guid = "2A67E116-23B1-4CDF-A339-62D52D6E511C"
license = false
eula = false

[[bin]]
name = "neosian"
path = "src/main.rs"

[dependencies]
# The state process (R2, #366): the HTTP stack is axum on tokio, the
# store's blocking calls under spawn_blocking; the hook verbs never start
# the runtime.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
fancy-regex = "0.19.2"
# `/mcp`'s standing stream (slice B, #370): one `unfold` over the session's
# end and the keep-alive tick; already in the tree through axum.
futures-util = { version = "0.3", default-features = false }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.28", features = ["v4"] }
# R2 slice C: synchronous HTTP, verified TLS, no runtime in the hook path.
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }
