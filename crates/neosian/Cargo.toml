[package]
name = "neosian"
description = "The state layer for LLM agents, as one static binary: the record, memory and the state process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["agents", "memory", "mcp", "llm"]
categories = ["command-line-utilities"]

[[bin]]
name = "neosian"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
