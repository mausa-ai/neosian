name: CI

# Least privilege at the top; a job that needs more grants it itself
# (publish-core.yml's publish jobs — DESIGN §29). Every action is pinned by
# commit SHA with its version beside it; the Dockerfile pins base images
# by digest. Dependabot maintains both.
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Event-keyed so a master push cannot cancel a dispatched run (DESIGN §11).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Pin the development runner used by contract and artifact checks.
env:
  UV_VERSION: "0.12.23"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make size
      - run: shellcheck scripts/install.sh scripts/container_test.sh

  # The crate's gates on the five targets the binary ships for (DESIGN
  # §39.4, ledger #338): rustup reads rust-toolchain.toml's pin, cargo-deny
  # and cargo-dist arrive as their prebuilt releases, the lockfile is
  # asserted, and the generated release.yml is checked against
  # dist-workspace.toml (a hand edit or a stale bump fails here). The lines
  # are the Makefile's rust-lint and rust-test, written out because the
  # Windows image carries no GNU make.
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2,cargo-dist@0.32.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo deny check
      - run: dist generate --check
      - run: cargo test --workspace --locked
      # The public curl entry point over real native artifacts, with no uv:
      # one successful installation and one deliberately corrupted archive.
      - if: matrix.runner == 'ubuntu-24.04' || matrix.runner == 'macos-15'
        run: dist build --artifacts=host --installer=shell --installer=npm
      - if: matrix.runner == 'ubuntu-24.04' || matrix.runner == 'macos-15'
        run: python3 scripts/check_binary_install.py
      - if: matrix.runner == 'ubuntu-24.04' || matrix.runner == 'macos-15'
        run: python3 scripts/check_npm_install.py
      # Independent contracts and latency against the release binary;
      # Python is only the development runner.
      - if: matrix.runner == 'ubuntu-24.04'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: matrix.runner == 'ubuntu-24.04'
        run: uv python install 3.12
      - if: matrix.runner == 'ubuntu-24.04'
        run: make install
      - if: matrix.runner == 'ubuntu-24.04'
        run: test -z "$(git status --porcelain)"
      - if: matrix.runner == 'ubuntu-24.04'
        run: python3 scripts/package_crate.py
      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo package --package neosian --locked --allow-dirty
      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo build --release --locked
      - if: matrix.runner == 'ubuntu-24.04'
        run: make test
        env:
          NEOSIAN_BINARY: target/release/neosian
      - if: matrix.runner == 'ubuntu-24.04'
        run: make bench-hooks


  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: cargo build --locked
      - run: make test-postgres
        env:
          NEOSIAN_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres

  # The container conformance run (DESIGN §18.9): build the image, then
  # the independent wire suite on FileStore and Postgres. No secret;
  # the registry push is publish-core.yml's, on a tag (DESIGN §29).
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: make test-container
        env:
          NEOSIAN_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres


  adapters:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node tests/clients/pi_record.mjs
      - run: node tests/clients/mailbox.mjs

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv run --locked pip-audit
