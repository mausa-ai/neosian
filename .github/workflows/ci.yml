name: CI

# Least privilege at the top; a job that needs more grants it itself
# (release.yml's publish jobs — DESIGN §29). Every action is pinned by
# commit SHA with its version beside it, the way the Dockerfile pins uv;
# Dependabot moves both together.
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # No schedule: real-API runs are deliberate, dispatched acts (user
  # ruling 2026-08-21, DESIGN §12 ledger #89) — never a standing cost.

# Event-keyed so a master push cannot cancel a dispatched run (DESIGN §11).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The repository's one uv pin (ledger #185): the Dockerfile, the installer
# and both workflows name the same release; a unit test keeps them equal.
env:
  UV_VERSION: "0.12.10"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make size
      - run: shellcheck scripts/install.sh

  # No secrets here — that absence is the keyless-boot assertion (DESIGN §11).
  # UV_PYTHON names the interpreter each leg runs; `python -V` prints it.
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: make install
      - run: uv run python -V
      - run: make test

  # The declared floors, resolved and tested (NF, TP-7): the lock is the
  # highest resolution, this job is the lowest one the floors claim —
  # an unlocked sync, the same unit tier, no secrets, on both Python
  # ends (the oldest exercises a floor's API, the newest its wheels).
  lowest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      UV_RESOLUTION: lowest-direct
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-groups
      - run: uv run python -V
      - run: uv tree --depth 1
      - run: make test

  # The locked dependency set against the advisory database (DESIGN §29):
  # every extra and group, the lock asserted unchanged. An advisory is a
  # finding — the fix is a lock bump; `--ignore-until-fixed <ID>` is the
  # escape hatch for a transitive with no fix yet.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv audit --locked

  # The artifact a stranger installs (NI, DESIGN §28): the wheel and sdist
  # built into a fresh directory (never `dist/` — TP-4), the sdist checked
  # for the license and against the planning surface (TP-3), and handed
  # to the installer job below.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
      - run: |
          sdist="$(ls "$RUNNER_TEMP"/dist/neosian-*.tar.gz)"
          tar tzf "$sdist" | grep -q '/LICENSE$'
          ! tar tzf "$sdist" | grep -E '^[^/]+/(\.claude|\.github|\.import_linter_cache|docs|branding)/'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  # scripts/install.sh as a stranger runs it: no setup-uv, no secrets, the
  # runner's own PATH — the script installs uv from its pinned release
  # when the image lacks it and reports which branch it took. Both runner
  # families, the built wheel as the source (`--find-links`), and the
  # installed shell must report the version pyproject declares.
  installer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - run: bash scripts/install.sh --find-links "$RUNNER_TEMP/dist"
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          expected="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          test "$(neosian version | grep -o 'v[0-9][0-9A-Za-z.]*' | head -1)" = "v$expected"
          neosian docs quickstart | head -1

  # Runs on every trigger, unlike the provider jobs: a service container
  # needs no secret and costs nothing, so the PostgresStore conformance
  # suite gates every push (DESIGN §12 ledger #40).
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: uv run pytest -m external_postgres -v
        env:
          NEOSIAN_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres

  # The container conformance run (DESIGN §18.9): build the image, then
  # both kits over a real socket against it on both backends — NM's
  # done-when. No secret; the registry push is release.yml's, on a tag
  # (DESIGN §29); every trigger.
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: make test-container
        env:
          NEOSIAN_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres

  # Dispatch only; an absent secret arrives as "" and the suite
  # self-skips per test (falsiness checks), keeping the job green.
  # A lane is the 40-cell pack plus the door probes on a flagship at its
  # default effort; a keyless lane still finishes in seconds. Door lanes
  # are paced to the account's rate limit (tests/external/pacing.py) and
  # run under an in-loop ceiling (tests/external/board.py): a paced lane
  # splits per transport, and a cut cell is a recorded `timeout` red,
  # never an idle runner (dispatch #14).
  external:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, anthropic, cerebras, xai, gemini, kimi, deepseek, qwen]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: uv run pytest -m external_${{ matrix.provider }} -v -s
        env:
          OPENAI_API_KEY: ${{ matrix.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          CEREBRAS_API_KEY: ${{ matrix.provider == 'cerebras' && secrets.CEREBRAS_API_KEY || '' }}
          XAI_API_KEY: ${{ matrix.provider == 'xai' && secrets.XAI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          MOONSHOT_API_KEY: ${{ matrix.provider == 'kimi' && secrets.MOONSHOT_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ matrix.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || '' }}
          DASHSCOPE_API_KEY: ${{ matrix.provider == 'qwen' && secrets.DASHSCOPE_API_KEY || '' }}
