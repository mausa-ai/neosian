name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # No schedule: real-API runs are deliberate, dispatched acts (user
  # ruling 2026-08-21, DESIGN §12 ledger #89) — never a standing cost.

# Event-keyed so a master push cannot cancel a dispatched run (DESIGN §11).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make size

  # No secrets here — that absence is the keyless-boot assertion (DESIGN §11).
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: make install
      - run: make test

  # Runs on every trigger, unlike the provider jobs: a service container
  # needs no secret and costs nothing, so the PostgresStore conformance
  # suite gates every push (DESIGN §12 ledger #40).
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: uv run pytest -m external_postgres -v
        env:
          NEOSIAN_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres

  # The container conformance run (DESIGN §18.9): build the image, then
  # both kits over a real socket against it on both backends — NM's
  # done-when. No secret, no registry push (ledger #114); every trigger.
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: make test-container
        env:
          NEOSIAN_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres

  # Dispatch only; an absent secret arrives as "" and the suite
  # self-skips per test (falsiness checks), keeping the job green.
  # A lane is the 24-cell pack plus the door probes on a flagship at its
  # default effort; a keyless lane still finishes in seconds. Candidate
  # lanes are paced to the account's rate limit (tests/external/pacing.py),
  # so a 3-requests-per-minute tier needs most of this budget.
  external:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, anthropic, cerebras, xai, gemini, deepseek, qwen, kimi]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: make install
      - run: uv run pytest -m external_${{ matrix.provider }} -v
        env:
          OPENAI_API_KEY: ${{ matrix.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          CEREBRAS_API_KEY: ${{ matrix.provider == 'cerebras' && secrets.CEREBRAS_API_KEY || '' }}
          XAI_API_KEY: ${{ matrix.provider == 'xai' && secrets.XAI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ matrix.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || '' }}
          DASHSCOPE_API_KEY: ${{ matrix.provider == 'qwen' && secrets.DASHSCOPE_API_KEY || '' }}
          MOONSHOT_API_KEY: ${{ matrix.provider == 'kimi' && secrets.MOONSHOT_API_KEY || '' }}
