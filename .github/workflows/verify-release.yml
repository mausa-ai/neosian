name: Verify release

# Deliberate live checks after publication, with no publishing permissions.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version, without the v prefix
        required: true
        type: string

permissions:
  contents: read

env:
  UV_VERSION: "0.12.23"
  NEOSIAN_VERIFY_VERSION: ${{ inputs.version }}
  NEOSIAN_VERIFY_ROOT: ${{ github.workspace }}/release

jobs:
  archives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      # Keep the verifier repairable without replacing a published release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: verifier
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          path: release
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv run --no-project --python 3.12 verifier/scripts/check_live_release.py archive
        env:
          NEOSIAN_VERIFY_TARGET: ${{ matrix.target }}
      - if: runner.os == 'Windows'
        run: uv run --no-project --python 3.12 verifier/scripts/check_live_release.py msi

  channels:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: verifier
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          path: release
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: uv run --no-project --python 3.12 verifier/scripts/check_live_release.py channels
