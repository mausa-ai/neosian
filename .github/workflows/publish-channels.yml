name: Publish (binary channels)

# Called by cargo-dist after hosting the archives. A dispatch only rehearses
# packaging; it cannot publish. Account setup is documented in SERVICES.md.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-channels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - id: check
        run: python3 scripts/check_channel_release.py npm artifacts/neosian-npm-package.tar.gz >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.publish == 'true'
        run: npm publish --access public artifacts/neosian-npm-package.tar.gz

  crate:
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cargo counts the ignored asset snapshot as dirty. Refuse source
      # changes first, then allow only the generated packaging inputs.
      - run: test -z "$(git status --porcelain)"
      - run: python3 scripts/package_crate.py
      - run: cargo package --package neosian --locked --allow-dirty
      - id: check
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/check_channel_release.py crate target/package/neosian-*.crate >> "$GITHUB_OUTPUT"
      # crates.io requires a token for the first publication. Delete this
      # bootstrap secret after configuring the crate's trusted publisher.
      - id: bootstrap
        if: steps.check.outputs.publish == 'true'
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$BOOTSTRAP_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - id: auth
        if: steps.check.outputs.publish == 'true' && steps.bootstrap.outputs.available != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: steps.check.outputs.publish == 'true'
        run: cargo publish --package neosian --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  homebrew:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mausa-ai/homebrew-neosian
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true
      - run: |
          python3 scripts/check_channel_release.py homebrew artifacts/neosian.rb
          mkdir -p tap/Formula
          cp artifacts/neosian.rb tap/Formula/neosian.rb
          cd tap
          git config user.name 'Mausa'
          git config user.email 'community@neosian.com'
          git add Formula/neosian.rb
          if ! git diff --cached --quiet; then
            git commit -s -m "neosian ${GITHUB_REF_NAME#v}"
            git push
          fi
