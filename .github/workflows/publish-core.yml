name: Publish (core artifacts)

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to recover after test-only repairs (blank builds without publishing)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: publish-core-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
env:
  UV_VERSION: "0.13.7"
  IMAGE: ghcr.io/mausa-ai/neosian
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          RELEASE_TAG: ${{ (github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name) || inputs.release_tag || '' }}
        run: python3 scripts/core_release.py >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2,cargo-dist@0.34.0
      - run: make install
      - run: make lint typecheck size rust-lint rust-test test
      - run: uv run --locked pip-audit
      - run: make docs-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-artifacts
          path: target/docs/*
          if-no-files-found: error
      - if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        # Recovery fills missing assets; retries accept only identical bytes.
        run: |
          mkdir -p target/published
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > target/published/names
          for path in target/docs/*; do
            name="${path##*/}"
            if grep -Fxq "$name" target/published/names; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir target/published
              cmp "$path" "target/published/$name"
            else
              gh release upload "$RELEASE_TAG" "$path"
            fi
          done

  # One native build per architecture (no emulation, no third-party
  # action); the smoke — the health route and the version inside the
  # image — runs before any push. The labels are OCI's; `source` links
  # the package to the repository.
  image:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      REVISION: ${{ needs.build.outputs.revision }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.revision }}
      - run: |
          docker buildx create --name release-export --driver docker-container \
            --driver-opt image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          docker buildx build --builder release-export --platform "linux/$ARCH" \
            --provenance=false \
            --output "type=docker,oci-mediatypes=true,dest=$RUNNER_TEMP/neosian-image.tar" \
            --label "org.opencontainers.image.title=neosian" \
            --label "org.opencontainers.image.description=The neosian state process: memory, skills, conversations and the ledger behind one bearer token" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE:$VERSION-$ARCH" .
          docker image load --input "$RUNNER_TEMP/neosian-image.tar"
      - name: smoke
        run: |
          cid="$(docker run -d -e NEOSIAN_SERVE_TOKEN=smoke -p 127.0.0.1:16367:6367 "$IMAGE:$VERSION-$ARCH")"
          trap 'docker logs "$cid"; docker rm -fv "$cid" >/dev/null' EXIT
          ok=
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:16367/health && \
                [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy ]; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          inside="$(docker run --rm --entrypoint /usr/local/bin/neosian "$IMAGE:$VERSION-$ARCH" version)"
          test "$inside" = "neosian v$VERSION"
      - if: needs.build.outputs.publish == 'true'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - if: needs.build.outputs.publish == 'true'
        name: Publish the tested image as an OCI manifest
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y skopeo
          fi
          ref="$IMAGE:$VERSION-$ARCH"
          # Copy the exact manifest loaded for the smoke test. Re-encoding a
          # Docker config as OCI here would lose its built-in health check.
          archive="$RUNNER_TEMP/neosian-image.tar"
          expected=$(tar -xOf "$archive" index.json | jq -er '
            .manifests | select(length == 1) | .[0] |
            select(.mediaType == "application/vnd.oci.image.manifest.v1+json") | .digest')
          skopeo copy --preserve-digests --digestfile "$RUNNER_TEMP/digest" \
            "oci-archive:$archive" "docker://$ref"
          test "$expected" = "$(cat "$RUNNER_TEMP/digest")"

  # The multi-arch index from the two pushed legs; `latest` only on a
  # final version — a pre-release is never what an unpinned pull gets.
  manifest:
    if: needs.build.outputs.publish == 'true'
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      REVISION: ${{ needs.build.outputs.revision }}
    steps:
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          tags=(-t "$IMAGE:$VERSION")
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
